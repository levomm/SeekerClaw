name: Hardened Update APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hardened-update:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode stable dApp signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > app/dappstore-release.jks

      - name: Prepare update-compatible hardened variant
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/val appVersionName = "2.3.1"/val appVersionName = "2.3.2"/' app/build.gradle.kts
          sed -i 's/val appVersionCode = 25/val appVersionCode = 26/' app/build.gradle.kts
          sed -i 's/applicationId = "com.seekerclaw.app"/applicationId = "com.seekerclaw.app.contextlitehardened"/' app/build.gradle.kts
          sed -i 's#<string name="app_name">SeekerClaw</string>#<string name="app_name">SeekerClaw Hardened</string>#' app/src/main/res/values/strings.xml
          grep -F 'val appVersionName = "2.3.2"' app/build.gradle.kts
          grep -F 'val appVersionCode = 26' app/build.gradle.kts
          grep -F 'applicationId = "com.seekerclaw.app.contextlitehardened"' app/build.gradle.kts
          grep -F '<string name="app_name">SeekerClaw Hardened</string>' app/src/main/res/values/strings.xml

      - name: Build update APK
        run: ./gradlew assembleDappStoreDebug
        env:
          SEEKERCLAW_KEYSTORE_PATH: dappstore-release.jks
          SEEKERCLAW_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SEEKERCLAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SEEKERCLAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/dappStore/debug/app-dappStore-debug.apk
          AAPT=${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)/aapt
          APKSIGNER=${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)/apksigner
          "$AAPT" dump badging "$APK" | head -1 | grep -F "package: name='com.seekerclaw.app.contextlitehardened' versionCode='26' versionName='2.3.2'"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Collect update APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hardened-out
          cp app/build/outputs/apk/dappStore/debug/app-dappStore-debug.apk hardened-out/SeekerClaw-Hardened-2.3.2-update.apk

      - name: Upload update APK
        uses: actions/upload-artifact@v4
        with:
          name: seekerclaw-hardened-update
          path: hardened-out/SeekerClaw-Hardened-2.3.2-update.apk
          retention-days: 14
