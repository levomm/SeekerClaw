name: Hardened Update APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run all offline CI and both JVM suites without building an APK
        type: boolean
        default: false
  schedule:
    - cron: '17 3 */5 * *'

jobs:
  hardened-update:
    runs-on: ubuntu-latest
    env:
      HARDENED_PACKAGE: com.seekerclaw.app.contextlitehardened2
      HARDENED_VERSION_NAME: '2.3.5'
      HARDENED_VERSION_CODE: '29'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      - name: All offline CI Node tests and smoke
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          text = pathlib.Path('.github/workflows/build.yml').read_text()
          block = re.search(r'for t in \\\n(.*?)\n          do', text, re.S).group(1)
          names = ['tool-schemas'] + [s.strip().rstrip('\\').strip() for s in block.splitlines()]
          names += ['interim-delivery', 'agent-preferences', 'telegram-commands']
          for name in names:
              subprocess.run(['node', 'tests/nodejs-project/' + name + '.test.js'], check=True)
          subprocess.run(['node', 'tests/nodejs-project/smoke.js'], check=True)
          PY

      - name: Both Android JVM suites (no APK assembly)
        run: ./gradlew testDappStoreDebugUnitTest testGooglePlayDebugUnitTest

      - name: Restore persistent Hardened signing key
        if: ${{ !inputs.validate_only }}
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .signing/hardened.jks
          key: seekerclaw-hardened-signing-v1

      - name: Require existing key (never replace installed signing identity)
        if: ${{ !inputs.validate_only && steps.signing-cache.outputs.cache-hit != 'true' }}
        run: |
          echo 'Persistent signing key missing; refusing to generate a replacement.' >&2
          exit 1

      - name: Prepare same-package Hardened update
        if: ${{ !inputs.validate_only }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          changes = [
              (r'val appVersionName = "[^"]+"', 'val appVersionName = "' + os.environ['HARDENED_VERSION_NAME'] + '"'),
              (r'val appVersionCode = \d+', 'val appVersionCode = ' + os.environ['HARDENED_VERSION_CODE']),
              (r'applicationId = "com.seekerclaw.app"', 'applicationId = "' + os.environ['HARDENED_PACKAGE'] + '"'),
          ]
          for pattern, replacement in changes:
              s, count = re.subn(pattern, replacement, s)
              if count != 1: raise SystemExit('Unexpected build identity anchor count')
          anchor = '    buildTypes {\n        release {'
          if s.count(anchor) != 1: raise SystemExit('Unexpected buildTypes anchor')
          s = s.replace(anchor, '    buildTypes {\n        debug {\n            signingConfig = signingConfigs.getByName("dappStore")\n        }\n        release {', 1)
          p.write_text(s)
          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          anchor = '<string name="app_name">SeekerClaw</string>'
          if s.count(anchor) != 1: raise SystemExit('Unexpected app label anchor')
          p.write_text(s.replace(anchor, '<string name="app_name">SeekerClaw Hardened 2</string>', 1))
          PY

      - name: Build only after all tests pass
        if: ${{ !inputs.validate_only }}
        run: ./gradlew assembleDappStoreDebug
        env:
          SEEKERCLAW_KEYSTORE_PATH: ${{ github.workspace }}/.signing/hardened.jks
          SEEKERCLAW_STORE_PASSWORD: seekerclaw-hardened-v1
          SEEKERCLAW_KEY_ALIAS: hardened
          SEEKERCLAW_KEY_PASSWORD: seekerclaw-hardened-v1

      - name: Verify package, greater versionCode, certificate and exact commit
        if: ${{ !inputs.validate_only }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/dappStore/debug/app-dappStore-debug.apk
          BT=$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)
          "${ANDROID_HOME}/build-tools/${BT}/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "package: name='${HARDENED_PACKAGE}' versionCode='${HARDENED_VERSION_CODE}' versionName='${HARDENED_VERSION_NAME}'" apk-badging.txt
          test "${HARDENED_VERSION_CODE}" -gt 28
          "${ANDROID_HOME}/build-tools/${BT}/apksigner" verify --print-certs "$APK" > apk-certificate.txt
          grep -F 'certificate SHA-256 digest: 8c9bb3754a1c1558c572e7e0d8b3b971cc5f2234f85c7e61e7e43423188b9c5e' apk-certificate.txt
          python3 - "$APK" <<'PY'
          import json, os, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              m = json.loads(apk.read('assets/build-metadata.json'))
          assert m['commit'] == os.environ['GITHUB_SHA'], 'Wrong packaged commit'
          assert int(m['versionCode']) == int(os.environ['HARDENED_VERSION_CODE'])
          assert m['versionName'] == os.environ['HARDENED_VERSION_NAME']
          PY

      - name: Collect verified update (never install)
        if: ${{ !inputs.validate_only }}
        run: |
          mkdir -p hardened-out
          cp app/build/outputs/apk/dappStore/debug/app-dappStore-debug.apk hardened-out/SeekerClaw-Hardened2-update.apk
          cp apk-certificate.txt hardened-out/APK-CERTIFICATE.txt
          cp apk-badging.txt hardened-out/APK-BADGING.txt
          printf 'commit=%s\npackage=%s\nversionCode=%s\nversionName=%s\n' "$GITHUB_SHA" "$HARDENED_PACKAGE" "$HARDENED_VERSION_CODE" "$HARDENED_VERSION_NAME" > hardened-out/APK-INFO.txt
          (cd hardened-out && sha256sum SeekerClaw-Hardened2-update.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.validate_only }}
        with:
          name: seekerclaw-hardened2-update
          path: hardened-out/
          retention-days: 30

      - name: JVM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardened-jvm-test-results
          path: app/build/test-results/test*UnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 7
