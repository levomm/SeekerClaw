name: Hardened Update APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 */5 * *'

jobs:
  hardened-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent Hardened signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .signing/hardened.jks
          key: seekerclaw-hardened-signing-v1

      - name: Require existing Hardened signing key for in-place updates
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo 'Persistent Hardened signing key is missing. Refusing to generate a replacement key: it would not update the installed app.' >&2
          exit 1

      - name: Node regression and smoke tests
        run: |
          node tests/nodejs-project/bridge-health-regression.test.js
          node tests/nodejs-project/tool-schemas.test.js
          node tests/nodejs-project/smoke.js

      - name: Prepare Hardened 2.3.4 parallel variant
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/val appVersionName = "2.3.1"/val appVersionName = "2.3.4"/' app/build.gradle.kts
          sed -i 's/val appVersionCode = 25/val appVersionCode = 28/' app/build.gradle.kts
          sed -i 's/applicationId = "com.seekerclaw.app"/applicationId = "com.seekerclaw.app.contextlitehardened2"/' app/build.gradle.kts
          sed -i 's#<string name="app_name">SeekerClaw</string>#<string name="app_name">SeekerClaw Hardened 2</string>#' app/src/main/res/values/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          needle = '    buildTypes {\n        release {'
          repl = '    buildTypes {\n        debug {\n            signingConfig = signingConfigs.getByName("dappStore")\n        }\n        release {'
          if needle not in s:
              raise SystemExit('buildTypes anchor not found')
          p.write_text(s.replace(needle, repl, 1))
          PY
          grep -F 'val appVersionName = "2.3.4"' app/build.gradle.kts
          grep -F 'val appVersionCode = 28' app/build.gradle.kts
          grep -F 'applicationId = "com.seekerclaw.app.contextlitehardened2"' app/build.gradle.kts
          grep -F 'signingConfig = signingConfigs.getByName("dappStore")' app/build.gradle.kts

      - name: JVM tests and Hardened APK build
        run: ./gradlew testDappStoreDebugUnitTest assembleDappStoreDebug
        env:
          SEEKERCLAW_KEYSTORE_PATH: ${{ github.workspace }}/.signing/hardened.jks
          SEEKERCLAW_STORE_PASSWORD: seekerclaw-hardened-v1
          SEEKERCLAW_KEY_ALIAS: hardened
          SEEKERCLAW_KEY_PASSWORD: seekerclaw-hardened-v1

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/dappStore/debug/app-dappStore-debug.apk
          BT=$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)
          AAPT=${ANDROID_HOME}/build-tools/${BT}/aapt
          APKSIGNER=${ANDROID_HOME}/build-tools/${BT}/apksigner
          "$AAPT" dump badging "$APK" | head -1 | grep -F "package: name='com.seekerclaw.app.contextlitehardened2' versionCode='28' versionName='2.3.4'"
          "$APKSIGNER" verify --print-certs "$APK"
          python3 - "$APK" <<'PY'
          import json, os, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              metadata = json.loads(apk.read('assets/build-metadata.json'))
          if metadata.get('commit') != os.environ['GITHUB_SHA']:
              raise SystemExit('APK commit does not match requested workflow commit')
          print('Verified packaged commit:', metadata['commit'])
          PY

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hardened-out
          cp app/build/outputs/apk/dappStore/debug/app-dappStore-debug.apk hardened-out/SeekerClaw-Hardened-2.3.4-Parallel.apk
          (cd hardened-out && sha256sum SeekerClaw-Hardened-2.3.4-Parallel.apk > SHA256SUMS)
          printf 'commit=%s\npackage=com.seekerclaw.app.contextlitehardened2\nversionCode=28\nversionName=2.3.4\n' "$GITHUB_SHA" > hardened-out/APK-INFO.txt
          BT=$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)
          "${ANDROID_HOME}/build-tools/${BT}/apksigner" verify --print-certs hardened-out/SeekerClaw-Hardened-2.3.4-Parallel.apk >> hardened-out/APK-INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seekerclaw-hardened-2.3.4-parallel
          path: hardened-out/
          retention-days: 30
