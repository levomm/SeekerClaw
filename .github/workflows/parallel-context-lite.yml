name: Parallel Context Lite APK

on:
  push:
    branches: [context-lite-parallel]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Give test build its own package id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = 'applicationId = "com.seekerclaw.app"'
          new = 'applicationId = "com.seekerclaw.app.contextlite"'
          if old not in s:
              raise SystemExit('applicationId line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build Google Play debug APK
        run: ./gradlew assembleGooglePlayDebug

      - name: Upload parallel APK
        uses: actions/upload-artifact@v4
        with:
          name: seekerclaw-context-lite-parallel
          path: app/build/outputs/apk/googlePlay/debug/*.apk
          retention-days: 14
