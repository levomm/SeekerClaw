name: Parallel Context Lite APK

on:
  push:
    branches: [context-lite-parallel]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Give hardened test build its own package id and label
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          old = 'applicationId = "com.seekerclaw.app"'
          new = 'applicationId = "com.seekerclaw.app.contextlitehardened"'
          if old not in s:
              raise SystemExit('applicationId line not found')
          gradle.write_text(s.replace(old, new, 1))

          strings = Path('app/src/main/res/values/strings.xml')
          t = strings.read_text()
          old_label = '<string name="app_name">SeekerClaw</string>'
          new_label = '<string name="app_name">SeekerClaw Hardened</string>'
          if old_label not in t:
              raise SystemExit('app_name line not found')
          strings.write_text(t.replace(old_label, new_label, 1))
          PY

      - name: Apply Context Lite hardening
        run: node scripts/apply-context-lite-hardening.js

      - name: Syntax-check patched Node runtime
        run: |
          node --check app/src/main/assets/nodejs-project/ai.js
          node --check app/src/main/assets/nodejs-project/tools/system.js

      - name: Build Google Play debug APK
        run: ./gradlew assembleGooglePlayDebug

      - name: Upload hardened parallel APK
        uses: actions/upload-artifact@v4
        with:
          name: seekerclaw-context-lite-hardened
          path: app/build/outputs/apk/googlePlay/debug/*.apk
          retention-days: 14
