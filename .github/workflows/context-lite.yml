name: Context Lite

on:
  pull_request:
    branches: ['**']
  push:
    branches: [context-lite]

jobs:
  context-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run context-lite regression check
        run: node testing/context-lite-check.js
